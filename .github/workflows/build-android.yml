name: Build Android

# 本仓库没有 gradle wrapper（android/gradlew 与 gradle-wrapper.jar 都不入库），
# 因此由 gradle/actions/setup-gradle@v3 按 gradle-version 提供 Gradle 8.7。
on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug + assembleRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          # setup-gradle 已经缓存 ~/.gradle/caches 与 ~/.gradle/wrapper，
          # 再叠一层 actions/cache 只是重复缓存，所以这里不再添加。

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认安装 "tools platform-tools"，但 Android 仓库已不再提供独立的
          # tools 包（sdkmanager 会报 "Warning: Failed to find package 'tools'" 并以 1 退出），
          # 因此显式列出需要安装的包。
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Ensure Android SDK 34
        run: |
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          sdkmanager --list_installed | grep -E "platforms;android-34|build-tools;34\.0\.0"

      - name: Toolchain versions
        run: |
          java -version
          gradle --version

      - name: Build debug and release APK
        run: |
          cd android
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      # 仓库里不放 keystore 与任何签名材料：CI 既不伪造签名，也不在流水线里生成密钥。
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NfcTapLink-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
