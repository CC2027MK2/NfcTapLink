// NfcTapLink · app 模块
// 纯 Java + Android SDK，零第三方库；v3 不把任何密钥 / device_id 注入构建产物。
plugins {
    id 'com.android.application'
}

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
def hasReleaseKey = ksFile.exists()
if (hasReleaseKey) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.example.nfctaplink'
    compileSdk 34

    buildFeatures {
        buildConfig false
    }

    signingConfigs {
        release {
            // 签名是 opt-in：只有 android/keystore.properties 存在时才配置 release 签名。
            // 没有该文件时 release 变体不带签名配置，产出 app-release-unsigned.apk，
            // 这样缺密钥的机器（含 CI）也能跑 assembleRelease，且不需要在流水线里生成密钥。
            if (hasReleaseKey) {
                storeFile rootProject.file(ksProps['storeFile'] ?: 'release.keystore')
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.example.nfctaplink"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "6.2.5"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 当前离线 Gradle 缓存没有 lint-gradle；安全回归由编译 + adb 真机链路验证。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
